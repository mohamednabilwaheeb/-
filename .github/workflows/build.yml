name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/copy-libs.js
      - name: Stamp version
        run: echo "window.APP_BUILD=${{ github.run_number }};window.APP_NATIVE=$(cat native-version.txt);" > www/app-version.js
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Dhahiat-Sumou-Mecca-TAAM.apk
      - name: Web bundle for in-app updates
        run: |
          cd www && zip -qr ../bundle.zip . && cd ..
          echo "{\"build\":${{ github.run_number }},\"native\":$(cat native-version.txt)}" > notes.md
          git log -1 --pretty=%s >> notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: SnagBlock5-apk
          path: Dhahiat-Sumou-Mecca-TAAM.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Dhahiat-Sumou-Mecca-TAAM.apk bundle.zip --title "Dhahiat Sumou Mecca TAAM - build ${{ github.run_number }}" --notes-file notes.md --latest
      - name: Deploy web version (GitHub Pages)
        run: |
          cd www
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "web build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
