name: Accounts maintenance
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency: accounts
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Process accounts
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p /tmp/acc && cp tools/accounts.js /tmp/acc/ && cd /tmp/acc
          npm init -y >/dev/null && npm i --no-audit --no-fund firebase-admin@12 >/dev/null
          node accounts.js
